[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnigent-session-status-extension"
version = "0.1.0"
description = "Example Omnigent extension: a status badge and menu on sidebar session rows"
requires-python = ">=3.12"
dependencies = ["omnigent>=0.11.0.dev0,<1"]

[project.entry-points."omnigent.extensions"]
session-status = "omnigent_session_status_extension.plugin:get_manifest"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
