[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnigent-review-checklist-extension"
version = "0.1.0"
description = "Example Omnigent extension: a per-session review checklist"
requires-python = ">=3.12"
dependencies = ["omnigent>=0.11.0.dev0,<1"]

[project.entry-points."omnigent.extensions"]
review-checklist = "omnigent_review_checklist_extension.plugin:get_manifest"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omnigent_review_checklist_extension = ["dist/extension.js", "dist/extension.css"]
