[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnigent-state-page-test"
version = "0.1.0"
description = "Test extension whose page uses Omnigent's session state through the browser SDK"
requires-python = ">=3.12"
dependencies = ["omnigent>=0.11.0.dev0,<1"]

[project.entry-points."omnigent.extensions"]
state-page = "omnigent_state_page_test.plugin:get_manifest"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
omnigent_state_page_test = ["dist/extension.js"]
