name: Build the custom tree
description: >-
  Apply custom/series onto custom/BASE with custom/scripts/build-custom.sh,
  using this checkout of the patches branch as the clone, into
  $RUNNER_TEMP/tree. A shallow checkout fetches BASE from origin first. The
  commit ids are reproducible, so every job builds the same commits.

outputs:
  custom-commit:
    description: The built tip commit
    value: ${{ steps.build.outputs.custom-commit }}
  tree:
    description: Path of the worktree holding the built commit
    value: ${{ steps.build.outputs.tree }}

runs:
  using: composite
  steps:
    - id: build
      shell: bash
      run: |
        base="$(tr -d '[:space:]' < custom/BASE)"
        git rev-parse --verify -q "$base^{commit}" >/dev/null \
          || git fetch -q --no-tags --depth=1 origin "$base"
        tree="$RUNNER_TEMP/tree"
        tip="$(custom/scripts/build-custom.sh --repo . --worktree "$tree" | tail -n 1)"
        echo "custom-commit=$tip" >> "$GITHUB_OUTPUT"
        echo "tree=$tree" >> "$GITHUB_OUTPUT"
