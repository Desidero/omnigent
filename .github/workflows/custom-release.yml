name: custom-release

# Builds Omnigent from custom/BASE plus custom/series on the patches branch,
# checks it and releases it. The only workflow of ours on this fork; it does
# not depend on any upstream workflow. See custom/README.md.
#
# Pull request into patches: the tree check (only custom/ and this workflow
# may differ from upstream at custom/BASE), apply the series and run the docs
# rule (job `apply`, the required check), type-check the web UI, run the
# tests near the patches the PR changes (all of them when BASE moves), and
# build the install set (wheels, constraints, host scripts, manifest, notes)
# as a workflow artifact, plus the server image (not pushed).
#
# Push to patches (a merge) that touches the series, the release tooling or
# this workflow: the same, then `publish` updates the custom branch, tags the
# build custom/<date>.<n>, pushes the server image to GHCR and creates a
# pre-release with the install set. This workflow is the only writer of
# custom and of custom/* tags.
#
# Manual run: a dry run by default (and always on a ref other than patches):
# everything, with publish printing the pushes, tag, image push and release.
# Daily schedule (runs only while patches is the default branch): only the
# job that switches upstream's workflows off.

on:
  pull_request:
    branches: [patches]
  push:
    branches: [patches]
    paths:
      - custom/BASE
      - custom/series
      - custom/patches/**
      - custom/release/**
      - '!custom/release/**/*.md'
      - custom/scripts/build-custom.sh
      - custom/scripts/check.sh
      - custom/scripts/check-tree.sh
      - custom/scripts/select-tests.py
      - .github/workflows/custom-release.yml
      - .github/actions/custom-*/**
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and plan the release, but push, tag and release nothing
        type: boolean
        default: true
      prerelease:
        description: Mark the release as a pre-release (production picks one later)
        type: boolean
        default: true
      all_tests:
        description: Run the tests for every patch, not only the changed ones
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('custom-pr-{0}', github.event.pull_request.number) || format('custom-{0}-{1}', github.event_name == 'schedule' && 'schedule' || 'build', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO || 'omnigent-ai/omnigent' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'ghcr.io/desidero/omnigent-server' }}
  PATCHES_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  # A release run: a push to patches, or a manual run (dry or not).
  RELEASE_RUN: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

jobs:
  upstream-workflows:
    name: switch off upstream workflows
    # The workflow token is read-only on pull requests from other forks.
    if: >-
      github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PATCHES_COMMIT }}
          persist-credentials: false
          sparse-checkout: custom/scripts
      - name: Disable every workflow but ours and cancel their runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: custom/scripts/disable-upstream-workflows.sh --repo "$GITHUB_REPOSITORY" --cancel-runs

  apply:
    name: apply
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      custom-commit: ${{ steps.tree.outputs.custom-commit }}
      pytest: ${{ steps.select.outputs.pytest }}
      vitest-run: ${{ steps.select.outputs.vitest-run }}
      vitest-related: ${{ steps.select.outputs.vitest-related }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PATCHES_COMMIT }}
          fetch-depth: 0
          persist-credentials: false

      - name: Only custom/ and this workflow differ from upstream at BASE
        run: |
          git fetch -q --no-tags "https://github.com/${UPSTREAM_REPO}.git" \
            "+refs/heads/main:refs/remotes/upstream/main"
          custom/scripts/check-tree.sh --upstream upstream/main HEAD

      - id: tree
        uses: ./.github/actions/custom-build-tree

      - name: Check docs, sanity and the index
        run: custom/scripts/check.sh --tree "$RUNNER_TEMP/tree"

      - name: Unit-test the scripts and the release tooling
        run: |
          python3 -m unittest discover -s custom/scripts/tests
          python3 -m unittest discover -s custom/release/tests

      - id: select
        name: Select tests near the changed patches
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          ALL_TESTS: ${{ inputs.all_tests || false }}
        run: |
          # A pull request covers what it changes; a release covers what changed
          # since the previous release. No previous release, or a moved BASE
          # (select-tests.py sees it), means every patch.
          since=""
          if [[ "$ALL_TESTS" != true && "$EVENT" == pull_request ]]; then
            since="$PR_BASE"
          elif [[ "$ALL_TESTS" != true ]]; then
            previous="$(git for-each-ref --sort=-creatordate --count=1 --format='%(refname)' 'refs/tags/custom/*')"
            if [[ -n "$previous" ]]; then
              since="$(git for-each-ref --format='%(contents)' "$previous" | sed -n 's/^Patches-Commit: //p' | head -n 1)"
              echo "previous release: ${previous#refs/tags/} (patches ${since:0:12})"
            fi
          fi
          if [[ -n "$since" ]] && git cat-file -e "$since^{commit}" 2>/dev/null; then
            custom/scripts/select-tests.py --tree "$RUNNER_TEMP/tree" --out selection --since "$since"
          else
            custom/scripts/select-tests.py --tree "$RUNNER_TEMP/tree" --out selection --all
          fi
          for kind in pytest vitest-run vitest-related; do
            echo "$kind=$(tr '\n' ' ' < "selection/$kind.txt")" >> "$GITHUB_OUTPUT"
          done
          {
            echo "### Tests selected for the changed patches"
            for kind in pytest vitest-run vitest-related; do
              echo "- \`$kind\`: $(wc -l < "selection/$kind.txt") files"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: web (tsc -b, vitest)
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PATCHES_COMMIT }}
          persist-credentials: false
      - uses: ./.github/actions/custom-build-tree
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install web dependencies
        working-directory: ${{ runner.temp }}/tree
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          npm install -g "$(node -p 'require("./package.json").packageManager')"
          pnpm install --frozen-lockfile --filter web
      - name: Type-check (tsc -b)
        working-directory: ${{ runner.temp }}/tree
        run: pnpm --filter web run type-check
      - name: Run the selected web tests
        working-directory: ${{ runner.temp }}/tree/web
        env:
          VITEST_RUN: ${{ needs.apply.outputs.vitest-run }}
          VITEST_RELATED: ${{ needs.apply.outputs.vitest-related }}
        run: |
          # shellcheck disable=SC2086 # the lists word-split into paths
          if [[ -n "${VITEST_RUN// }" ]]; then pnpm exec vitest run $VITEST_RUN; fi
          # shellcheck disable=SC2086
          if [[ -n "${VITEST_RELATED// }" ]]; then
            pnpm exec vitest related --run --passWithNoTests $VITEST_RELATED
          fi

  python:
    name: python (selected pytest)
    needs: apply
    if: needs.apply.outputs.pytest != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PATCHES_COMMIT }}
          persist-credentials: false
      - uses: ./.github/actions/custom-build-tree
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            custom/series
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install test system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ripgrep bubblewrap tmux
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Install Python dependencies
        working-directory: ${{ runner.temp }}/tree
        env:
          OMNIGENT_SKIP_WEB_UI: "true"
        run: uv sync --locked --extra all --group test
      - name: Run the selected tests
        working-directory: ${{ runner.temp }}/tree
        env:
          PYTEST_FILES: ${{ needs.apply.outputs.pytest }}
          PYTHONFAULTHANDLER: "1"
          OMNIGENT_TEST_TIMEOUT_SCALE: "4"
        run: |
          # shellcheck disable=SC2086 # the list word-splits into paths
          env -u OPENAI_API_KEY -u ANTHROPIC_API_KEY -u DATABRICKS_TOKEN \
            uv run pytest $PYTEST_FILES -m "not databricks" -n 4 --dist=loadfile \
              --timeout=300 -q -r fE

  package:
    name: package (install set and image)
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.build.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PATCHES_COMMIT }}
          persist-credentials: false
      - id: tree
        uses: ./.github/actions/custom-build-tree
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            custom/series
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Set up pnpm
        working-directory: ${{ runner.temp }}/tree
        run: npm install -g "$(node -p 'require("./package.json").packageManager')"

      - name: Plan the release tag
        id: plan
        if: env.RELEASE_RUN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTOM_COMMIT: ${{ steps.tree.outputs.custom-commit }}
        run: |
          python3 -I custom/release/plan.py --fork "$GITHUB_REPOSITORY" --custom "$CUSTOM_COMMIT" \
            --patches-commit "$PATCHES_COMMIT" --previous-manifest-out previous-manifest.json \
            | tee plan.env
          cat plan.env >> "$GITHUB_OUTPUT"

      - name: Build the install set
        id: build
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          args=(--tree "$RUNNER_TEMP/tree" --out out --patches-commit "$PATCHES_COMMIT"
            --fork "$GITHUB_REPOSITORY" --image "$IMAGE_NAME")
          [[ -z "$TAG" ]] || args+=(--tag "$TAG")
          [[ ! -s previous-manifest.json ]] || args+=(--previous-manifest previous-manifest.json)
          if [[ -n "$PR_NUMBER" ]]; then
            args+=(--note "**Pull request:** https://github.com/$GITHUB_REPOSITORY/pull/$PR_NUMBER (a build to try, not a release)")
          fi
          custom/release/build.sh "${args[@]}"
          cp plan.env out/ 2>/dev/null || true
          . out/build.env
          echo "artifact=install-set-$BUILD_ID" >> "$GITHUB_OUTPUT"
          cat out/notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Build and smoke-test the server image (not pushed)
        run: |
          custom/release/build-image.sh out
          . out/build.env
          reported="$(docker run --rm --entrypoint omnigent -e OMNIGENT_NO_UPDATE_CHECK=1 "$IMAGE" --version)"
          echo "$reported"
          [[ "$reported" == "omnigent $VERSION (${CUSTOM_COMMIT:0:8},"* ]] \
            || { echo "::error::the image reports '$reported', expected $VERSION"; exit 1; }
          docker run -d --name smoke -e DATABASE_URL=sqlite:////data/smoke.db -p 127.0.0.1:18000:8000 "$IMAGE"
          for _ in $(seq 1 45); do
            curl -fsS 127.0.0.1:18000/health && break
            sleep 2
          done
          curl -fsS 127.0.0.1:18000/health || { docker logs smoke; exit 1; }
          docker rm -f smoke

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: out/
          retention-days: 30
          if-no-files-found: error

  publish:
    name: publish (custom branch, tag, image, release)
    needs: [apply, web, python, package]
    # python is skipped when no Python tests were selected; that still counts.
    if: >-
      always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && needs.apply.result == 'success' && needs.web.result == 'success'
      && needs.package.result == 'success'
      && (needs.python.result == 'success' || needs.python.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Only a real run uses the environment, which holds the optional fallback
    # secrets (custom/release/README.md) and may be limited to patches.
    environment: ${{ github.ref == 'refs/heads/patches' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) && 'custom-release' || '' }}
    concurrency:
      group: custom-publish
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    env:
      DRY_RUN: ${{ !(github.ref == 'refs/heads/patches' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))) }}
      PRERELEASE: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PATCHES_COMMIT }}
          fetch-depth: 0
          persist-credentials: false
      - id: tree
        uses: ./.github/actions/custom-build-tree
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: out
      - name: Publish
        env:
          BUILT: ${{ steps.tree.outputs.custom-commit }}
          FORK_REPO: ${{ github.repository }}
          # The workflow token by default. CUSTOM_DEPLOY_KEY (a write deploy key,
          # a ruleset bypass actor) or CUSTOM_PUBLISH_TOKEN replace it for the
          # pushes and the release only if GitHub refuses it.
          PUSH_SSH_KEY: ${{ secrets.CUSTOM_DEPLOY_KEY }}
          PUSH_TOKEN: ${{ secrets.CUSTOM_PUBLISH_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.CUSTOM_PUBLISH_TOKEN || github.token }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
        run: custom/release/publish.sh out "$BUILT"
