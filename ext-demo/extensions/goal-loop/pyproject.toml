[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "desidero-goal-loop"
version = "0.1.0"
description = "Omnigent extension: keep a session working on a goal (its PRs green) until it is met"
requires-python = ">=3.12"
dependencies = ["omnigent>=0.11.0.dev0,<1"]

[project.entry-points."omnigent.extensions"]
goal-loop = "desidero_goal_loop.plugin:get_manifest"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
desidero_goal_loop = ["dist/extension.js", "dist/extension.css"]
